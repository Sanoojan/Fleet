replay_batch_ratio: 3.2
replay_fake_fraction: 0.5
replay_sampling_strategy: fixed
# Reserved ablation: enabling this currently fails explicitly.
treasure_replay_enabled: false
adaptation_epochs: 20
learning_rate: 0.00003
weight_decay: 0.01
support_batch_size: 10
trainable_components: [lora, xception, xception_fc, routing, projection]
distillation_weight: 10.0
avoidance_weight: 20.0
contrastive_weight: 5.0
contrastive_warmup_epochs: 5
temperature: 0.07
num_workers: 4
evaluation_batch_size: 128
retention_samples_per_class: 1000
xception_crop_size: 128
checkpoint_frequency: 0
best_metric: auroc
resume: true
max_generators: null
max_evaluation_samples_per_generator: null
model:
  xception_feature_dim: 1024
  projection_dim: 256
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.0
  feature_layer: -1
  use_last_hidden_state: false
  normalize_feature: false
wandb:
  project: fleet-treasure-continual
