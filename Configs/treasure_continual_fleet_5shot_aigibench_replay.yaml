experiment_name: treasure_continual_fleet_5shot_aigibench_replay
seed: 42
pretrained_checkpoint: outputs_single_gpu/checkpoints_q128/pretrain_dual_branch_with_attn_loss_and_coverage_no_residual_q128.pth
prototype_path: outputs_single_gpu/checkpoints_q128/prototypes_dual_branch_with_attn_loss_and_coverage_no_residual_q128_freq
model_path: weights/dinov3-vitl16-pretrain-lvd1689m
aigibench_train_path: data/AIGIBench/train
aigibench_validation_path: data/AIGIBench/val
treasure_fake_root: data/Treasure/fake
treasure_real_root: data/Treasure/real
real_support_root: data/Treasure/real/cc12m-2mp-realistic
generator_order_file: Configs/treasure_generator_order.csv
output_root: All_outputs
shot_count: 5
support_composition: {fake: 5, real: 5}
decision_threshold: 0.5
replay_enabled: true
replay_size: 1000
replay_batch_size: 32
